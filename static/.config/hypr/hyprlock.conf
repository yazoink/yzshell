# largely stolen from end-4

source=~/.config/hypr/hyprlock/colours.conf
source=~/.config/hypr/hyprlock/background.conf

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.15
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    shadow_size = $widget_shadow_size
    shadow_color = $shadow_colour
    fade_on_empty = true
    #rounding = 8

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    shadow_size = $text_shadow_size
    shadow_color = $shadow_colour
    shadow_boost = $text_shadow_boost
    position = -30, 30
    halign = right
    valign = bottom
}

label { # Caps Lock Warning
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check_capslock.sh
    color = $text_color
    font_size = 13
    font_family = $font_family
    shadow_size = $text_shadow_size
    shadow_color = $shadow_colour
    shadow_boost = $text_shadow_boost
    position = 0, -25
    halign = center
    valign = center
}


label { # Clock
    monitor =
    #text = <span font_weight='bold'>$TIME</span>
    text = $TIME
    color = $text_color
    font_size = 65
    font_family = $font_family_clock
    shadow_size = $text_shadow_size
    shadow_color = $shadow_colour
    shadow_boost = $text_shadow_boost

    position = 0, 300
    halign = center
    valign = center
}
label { # Date
    monitor =
    text = cmd[update:5000] date +"%A, %B %d"
    color = $text_color
    font_size = 17
    font_family = $font_family_clock
    shadow_size = $text_shadow_size
    shadow_color = $shadow_colour
    shadow_boost = $text_shadow_boost

    position = 0, 240
    halign = center
    valign = center
}

label { # User
    monitor =
    text = <span font_family='Font Awesome 7 Free' font_weight='bold'></span> $USER
    color = $text_color
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 20
    font_family = $font_family
    shadow_size = $text_shadow_size
    shadow_color = $shadow_colour
    shadow_boost = $text_shadow_boost
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Status
    monitor =
    text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
    color = $text_color
    font_size = 14
    font_family = $font_family
    shadow_size = $text_shadow_size
    shadow_color = $shadow_colour
    shadow_boost = $text_shadow_boost

    position = 30, -30
    halign = left
    valign = top
}